plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.phairplay'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        minSdk 24
        buildConfigField 'String', 'VERSION_NAME', '"1.0.0-alpha.8-polaroid-api24"'
        buildConfigField 'int', 'VERSION_CODE', '11'
        buildConfigField 'String', 'FLAVOR', '"polaroid"'
        buildConfigField 'String', 'CAST_APP_ID', '""'
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
        ndk { abiFilters 'armeabi-v7a' }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/kotlin', 'src/firetv-kotlin']
            res.srcDirs = ['src/main/res']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { buildConfig true }
    packaging {
        jniLibs { keepDebugSymbols += '**/*.so' }
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/**', 'META-INF/NOTICE.md', 'META-INF/LICENSE.md']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.leanback:leanback:1.2.0'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.jakewharton.timber:timber:5.0.1'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'com.googlecode.plist:dd-plist:1.28'
}

