plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.polaroid.litehome'
    compileSdk 35

    defaultConfig {
        applicationId 'tv.polaroid.litehome'
        minSdk 24
        targetSdk 28
        versionCode 40
        versionName '3.26'
    }
    packaging {
        resources {
            excludes += [
                    'META-INF/versions/9/OSGI-INF/**',
                    'META-INF/NOTICE.md',
                    'META-INF/LICENSE.md'
            ]
        }
    }
}

dependencies {
    implementation project(':phairplay')
    implementation 'androidx.fragment:fragment:1.5.4'
}
