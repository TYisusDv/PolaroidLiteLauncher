<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0a0d13"><title>TV Remote</title>
<style>
:root{color-scheme:dark;--white:#f6f7fa;--muted:#adb3bf;--blue:#83b9ff}*{box-sizing:border-box}html{min-height:100%;background:#090c12}body{margin:0;min-height:100vh;min-height:100dvh;padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));display:flex;justify-content:center;background:radial-gradient(ellipse at 50% -22%,#182131 0,transparent 56%),linear-gradient(155deg,#0b0e15,#080b11 68%,#0c1018);color:var(--white);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit;color:inherit}button{border:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}.shell{width:min(100%,390px);animation:arrive .38s cubic-bezier(.2,.8,.2,1) both}.remote{display:none}.remote.show{display:block;animation:arrive .36s cubic-bezier(.2,.8,.2,1) both}.pairbox{animation:arrive .36s cubic-bezier(.2,.8,.2,1) both}.pairbox.hide{display:none}.topline{display:flex;align-items:center;gap:11px;margin:0 0 27px}.brand-icon{width:36px;height:36px;display:grid;place-items:center;border-radius:13px;background:#1d2634;color:#a9caff}.brand-icon svg{width:21px;height:21px}.brand{font-size:11px;font-weight:750;letter-spacing:.12em;color:#8f9caf}h1{font-size:27px;line-height:1.12;letter-spacing:-.035em;margin:0;font-weight:690}.sub{font-size:14px;color:#aab2c0;margin:9px 0 25px;line-height:1.5}.pair-heading{display:flex;align-items:center;gap:14px;margin:10px 0 4px}.pair-mark{width:48px;height:48px;border-radius:17px;background:#1a202c;display:grid;place-items:center;color:var(--blue);flex:none}.pair-mark svg{width:24px;height:24px}.connection{display:flex;align-items:center;gap:9px;color:#c8ced8;font-size:14px;margin:7px 0 0}.dot{width:10px;height:10px;border-radius:50%;background:#17c56a;box-shadow:0 0 13px #17c56a55;flex:none}.pin-label{display:block;color:#9fa9b8;font-size:12px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;margin:26px 0 9px}.pinrow{display:flex;gap:10px}.pin-input{width:100%;min-width:0;height:58px;padding:0 16px;border:1px solid #323a49;border-radius:17px;background:#151a23;outline:none;text-align:center;font-size:23px;font-weight:650;letter-spacing:.34em;transition:border-color .2s,box-shadow .2s,background .2s}.pin-input::placeholder{color:#667183;opacity:1;letter-spacing:.28em}.pin-input:hover{background:#1a202a}.pin-input:focus{border-color:#82b7ff;box-shadow:0 0 0 3px #82b7ff24}.pair-btn{height:56px;min-width:114px;padding:0 18px;border-radius:17px;background:#f0f2f7;color:#111722;font-weight:700;transition:transform .2s,background .2s,box-shadow .2s}.pair-btn:disabled{opacity:.72}.msg{min-height:20px;margin:10px 2px 0;color:#ff9e9e;font-size:12px}.head{display:flex;align-items:center;justify-content:space-between;margin:5px 0 28px}.status{display:flex;align-items:center;gap:9px;font-size:15px;color:#c7cbd3;margin:8px 0 0}.power{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#cf302b,#a91f1b);box-shadow:0 8px 25px #b8221f33;transition:transform .2s,filter .2s,box-shadow .2s}.power svg{width:29px;height:29px}.quick{display:flex;justify-content:space-between;gap:20px;margin:0 0 31px;padding:0 8px}.quick-btn{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#1c222e,#171c26);transition:transform .2s,background .2s,box-shadow .2s}.quick-btn svg{width:30px;height:30px}.mic{color:#40aaff}.pad{width:min(82vw,320px);height:min(82vw,320px);margin:0 auto 28px;border-radius:50%;position:relative;background:linear-gradient(145deg,#1b202a,#151a24 76%);border:1px solid #343b49;box-shadow:inset 0 1px 0 #ffffff0b,0 16px 42px #0005}.key{position:absolute;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:transparent;color:#f4f5f8;transition:transform .18s,background .18s,box-shadow .18s}.key svg{width:27px;height:27px}.up{left:calc(50% - 34px);top:13px}.down{left:calc(50% - 34px);bottom:13px}.left{left:13px;top:calc(50% - 34px)}.right{right:13px;top:calc(50% - 34px)}.ok{left:50%;top:50%;transform:translate(-50%,-50%);width:130px;height:130px;background:#10141d;font-size:23px;font-weight:540}.bar{height:82px;display:flex;align-items:stretch;border:1px solid #242b37;border-radius:44px;background:linear-gradient(145deg,#1b202a,#151a23);overflow:hidden;margin:0 0 18px;box-shadow:inset 0 1px #ffffff08}.bar button{flex:1;display:grid;place-items:center;background:transparent;transition:transform .18s,background .18s,box-shadow .18s}.bar svg{width:29px;height:29px}.media button+button{border-left:1px solid #ffffff07}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}.tile{height:112px;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(145deg,#1b202a,#151a23);color:#e6e8ed;font-size:16px;transition:transform .2s,background .2s,box-shadow .2s}.tile svg{width:28px;height:28px;color:#d7dce5}.forget{display:block;margin:26px auto 2px;padding:10px 14px;background:transparent;color:#7f899a;font-size:12px;transition:color .2s,transform .2s}.typing{display:none;margin-top:16px;gap:8px}.typing.show{display:flex;animation:arrive .2s ease-out both}.typing input{flex:1;min-width:0;background:#151a23;border:1px solid #30394a;border-radius:14px;padding:12px 14px;outline:none}.typing input:focus{border-color:#82b7ff;box-shadow:0 0 0 3px #82b7ff24}.send{border-radius:14px;padding:0 16px;background:#e8edf6;color:#111722;font-weight:650}.remote-msg{min-height:17px;color:#ff9e9e;text-align:center;font-size:12px;margin:6px 0 0}button:focus-visible{outline:2px solid #90bdff;outline-offset:3px}@media(hover:hover){button:hover{transform:scale(1.045);filter:brightness(1.13);box-shadow:0 8px 22px #0004}.ok:hover{transform:translate(-50%,-50%) scale(1.045)}.pin-input:hover{transform:none}.pair-btn:hover{transform:translateY(-1px) scale(1.025);box-shadow:0 8px 20px #dce8ff24}.forget:hover{transform:none;box-shadow:none;color:#d0d6df}}button:active{transform:scale(.95);filter:brightness(1.2)}.ok:active{transform:translate(-50%,-50%) scale(.96)}@keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@media(min-width:600px){body{align-items:flex-start;padding-top:42px}.shell{width:min(100%,420px)}}@media(max-height:760px){body{padding-top:16px;padding-bottom:16px}.head{margin-bottom:18px}.quick{margin-bottom:18px}.pad{width:min(67vw,270px);height:min(67vw,270px);margin-bottom:17px}.bar{height:62px;margin-bottom:12px}.tiles{margin-top:18px}.tile{height:88px}.forget{margin-top:14px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head><body><main class="shell"><div class="topline"><span class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="m9 10 6 3-6 3zM8 3l2 3m6-3-2 3"/></svg></span><span class="brand">POLAROID · LITE HOME</span></div>
<section class="pairbox" id="pairbox"><div class="pair-heading"><span class="pair-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.8"/><path d="M10 5.5h4M10 18.5h4"/><circle cx="12" cy="12" r="1.2"/></svg></span><div><h1>TV Remote</h1><p class="connection"><span class="dot"></span>Lista para conectar</p></div></div><p class="sub">Controla tu tele desde el teléfono. Ingresa el PIN que aparece en Lite Home.</p><label class="pin-label" for="pin">PIN de la televisión</label><div class="pinrow"><input class="pin-input" id="pin" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="••••••" aria-label="PIN de seis dígitos"><button class="pair-btn" id="pair">Conectar</button></div><p class="msg" id="msg" role="status" aria-live="polite"></p></section>
<section class="remote" id="remote" aria-label="Control remoto"><header class="head"><div><h1>TV Remote</h1><p class="status"><span class="dot"></span>Conectado</p></div><button class="power" data-key="power" aria-label="Encendido"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 2.8v9.1M6.2 5.8a8.1 8.1 0 1 0 11.6 0"/></svg></button></header>
<div class="quick"><button class="quick-btn" data-key="back" aria-label="Atrás"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m7-7-7 7 7 7"/></svg></button><button class="quick-btn" data-key="home" aria-label="Inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7M5.5 9v11h13V9M9.5 20v-7h5v7"/></svg></button><button class="quick-btn mic" data-key="voice" aria-label="Búsqueda por voz"><svg viewBox="0 0 24 24"><path fill="#24a9ff" d="M12 14a3.5 3.5 0 0 0 3.5-3.5v-5a3.5 3.5 0 0 0-7 0v5A3.5 3.5 0 0 0 12 14Z"/><path fill="#ef5145" d="M6 10.5a1 1 0 0 1 2 0 4 4 0 0 0 8 0 1 1 0 0 1 2 0 6 6 0 0 1-5 5.92V19h2a1 1 0 1 1 0 2H9a1 1 0 1 1 0-2h2v-2.58A6 6 0 0 1 6 10.5Z"/><path fill="#35bc69" d="M11 17h2v4h-2z"/></svg></button></div>
<div class="pad" role="group" aria-label="Navegación"><button class="key up" data-key="up" aria-label="Arriba"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 15 7-7 7 7"/></svg></button><button class="key left" data-key="left" aria-label="Izquierda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg></button><button class="key ok" data-key="ok">OK</button><button class="key right" data-key="right" aria-label="Derecha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></button><button class="key down" data-key="down" aria-label="Abajo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 9 7 7 7-7"/></svg></button></div>
<div class="bar volume"><button data-key="volume_down" aria-label="Bajar volumen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"/></svg></button><button data-key="mute" aria-label="Silenciar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6l-5 4H4Z"/><path d="m17 9 5 6m0-6-5 6"/></svg></button><button data-key="volume_up" aria-label="Subir volumen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14M12 5v14"/></svg></button></div>
<div class="bar media"><button data-key="previous" aria-label="Anterior"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 5h2v14H5zm14 0v14L8 12z"/></svg></button><button data-key="play_pause" aria-label="Reproducir o pausar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h3v16H4zm15 0v16L8 12z"/></svg></button><button data-key="next" aria-label="Siguiente"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 5h2v14h-2zM5 5v14l11-7z"/></svg></button></div>
<div class="tiles"><button class="tile" data-key="apps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="4" height="4" rx=".8"/><rect x="10" y="4" width="4" height="4" rx=".8"/><rect x="16" y="4" width="4" height="4" rx=".8"/><rect x="4" y="10" width="4" height="4" rx=".8"/><rect x="10" y="10" width="4" height="4" rx=".8"/><rect x="16" y="10" width="4" height="4" rx=".8"/><rect x="4" y="16" width="4" height="4" rx=".8"/><rect x="10" y="16" width="4" height="4" rx=".8"/><rect x="16" y="16" width="4" height="4" rx=".8"/></svg>Apps</button><button class="tile" id="keyboardButton"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M6 9h1m3 0h1m3 0h1m3 0h1M6 12h1m3 0h1m3 0h1m3 0h1M8 15h8"/></svg>Teclado</button></div><div class="typing" id="typing"><input id="remoteText" type="text" autocomplete="off" placeholder="Escribe en la televisión"><button class="send" id="sendText">Enviar</button></div><p class="remote-msg" id="remoteMsg" role="status" aria-live="polite"></p><button class="forget" id="forget">Desconectar este teléfono</button></section></main>
<script>
var pairbox=document.getElementById('pairbox'),remote=document.getElementById('remote'),msg=document.getElementById('msg'),remoteMsg=document.getElementById('remoteMsg'),token='';function readToken(){try{return localStorage.getItem('polaroidRemoteToken')||''}catch(e){return ''}}token=readToken();function post(path,data){var body=Object.keys(data).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(data[k])}).join('&');return fetch(path,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body})}function showRemote(){pairbox.classList.add('hide');remote.classList.add('show')}function clearSession(message){token='';try{localStorage.removeItem('polaroidRemoteToken')}catch(e){}remote.classList.remove('show');pairbox.classList.remove('hide');msg.textContent=message||''}function pair(){var pin=document.getElementById('pin').value.replace(/[^0-9]/g,'');if(pin.length!==6){msg.textContent='Escribe los seis dígitos del PIN.';return}var button=document.getElementById('pair');button.disabled=true;button.textContent='Conectando…';post('/pair',{pin:pin}).then(function(r){if(!r.ok)throw new Error(r.status===429?'Espera un momento antes de volver a intentarlo.':'PIN incorrecto. Revisa el código de la TV.');return r.json()}).then(function(d){token=d.token;try{localStorage.setItem('polaroidRemoteToken',token)}catch(e){}showRemote();msg.textContent=''}).catch(function(e){msg.textContent=e.message||'No se pudo conectar con la TV.'}).finally(function(){button.disabled=false;button.textContent='Conectar'})}document.getElementById('pair').onclick=pair;document.getElementById('pin').addEventListener('keydown',function(e){if(e.key==='Enter')pair()});document.querySelectorAll('[data-key]').forEach(function(b){b.addEventListener('click',function(){post('/key',{token:token,key:b.getAttribute('data-key')}).then(function(r){if(r.status===401)clearSession('La sesión venció. Empareja otra vez con el PIN de la TV.');else if(!r.ok)remoteMsg.textContent='Esta acción no está disponible ahora.'}).catch(function(){remoteMsg.textContent='No hay conexión con la TV.'})})});document.getElementById('keyboardButton').onclick=function(){var typing=document.getElementById('typing');typing.classList.toggle('show');if(typing.classList.contains('show'))document.getElementById('remoteText').focus()};document.getElementById('sendText').onclick=function(){var field=document.getElementById('remoteText'),value=field.value.trim();if(!value)return;post('/key',{token:token,key:'text',text:value}).then(function(r){if(r.status===401)clearSession('La sesión venció. Empareja otra vez con el PIN de la TV.');else if(!r.ok)remoteMsg.textContent='Selecciona primero un campo de texto en la TV.';else{field.value='';remoteMsg.textContent='Texto enviado.'}}).catch(function(){remoteMsg.textContent='No hay conexión con la TV.'})};document.getElementById('remoteText').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('sendText').click()});document.getElementById('forget').onclick=function(){post('/unpair',{token:token}).catch(function(){});clearSession('Sesión desconectada.')};if(token){post('/resume',{token:token}).then(function(r){if(r.ok)showRemote();else clearSession('Empareja con el PIN actual de la TV.')}).catch(function(){clearSession('No hay conexión con la TV.')})}
</script></body></html>
